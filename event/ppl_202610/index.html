<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>첫 구독 이벤트</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #fff;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        /* 이미지 한 장 = 섹션 하나. 폰 한 화면보다 짧게 잘라 둔다. 버튼은 이미지 위에 % 좌표로 겹친다 (원본 750px 기준) */
        .section {
            position: relative;
            line-height: 0;
        }

        .section img {
            display: block;
            width: 100%;
            height: auto;
        }

        .hotspot {
            position: absolute;
            display: block;
            border: none;
            padding: 0;
            margin: 0;
            background: transparent;
            cursor: pointer;
            border-radius: 12px;
        }

        .hotspot:active {
            background: rgba(255, 255, 255, .15);
        }

        .hotspot:disabled {
            cursor: default;
        }

        /* 로컬 확인용: 주소 끝에 #hotspot 을 붙이면 누르는 영역이 보인다 */
        .show-hotspot .hotspot {
            outline: 3px dashed #ff2d55;
            background: rgba(255, 45, 85, .15);
        }
    </style>
</head>
<body>
<div class="container">

    <div class="section">

                style="left: 6.667%; width: 86.667%; top: 67.996%; height: 9.497%;"></button>
    </div>

    <div class="section">
        <img src="images/03-1.png" alt="같은 팩은 하나도 없어요, 원하는 영양제만 쏙쏙 골라 담아보세요" />
    </div>

    <div class="section">
        <img src="images/03-2.gif" alt="" />
        <!-- 영양제 골라 담기: x 50~700, y 693~792 / 750x923 -->
        <a class="hotspot" href="estherpack://store" aria-label="영양제 골라 담기"
           style="left: 6.667%; width: 86.667%; top: 75.081%; height: 10.834%;"></a>
    </div>

    <div class="section">
        <img src="images/04-1.jpg" alt="캔디언니는 이렇게 만들었어요" />
    </div>

    <div class="section">
        <img src="images/04-2.jpg" alt="" />
        <!-- 캔디언니팩 그대로 담기: x 50~700, y 602~701 / 750x992. 번들팩(상품 66) 상세로 이동 -->
        <a class="hotspot" href="estherpack://store/goods?goodsId=66" id="setButton" aria-label="캔디언니팩 그대로 담기"
           style="left: 6.667%; width: 86.667%; top: 60.685%; height: 10.081%;"></a>
        <!-- 원하는 영양제 골라담기: x 50~700, y 712~811 / 750x992 -->

           style="left: 6.667%; width: 86.667%; top: 71.774%; height: 10.081%;"></a>

    <div class="section">

    <div class="section">

        <!-- 문진하고 추천받기: x 50~700, y 34~133 / 750x905 -->

        <!-- 무료 상담 예약하기: x 50~700, y 794~893 / 750x1074 -->

    <div class="section">

    <div class="section">

    <div class="section">

    </div>
</div>

<script>
    (function () {
        // 운영 50% 할인쿠폰 등록 코드
        var COUPON_CODE = 'DOWNLOAD507318';

        var pending = {};
        var seq = 0;
        var couponButton = document.getElementById('couponButton');

        function channel() {
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.estherpack) {
                return 'ios';
            }
            if (window.estherpack && typeof window.estherpack.postMessage === 'function') {
                return 'android';
            }
            return null;
        }

        function send(action, payload) {
            var c = channel();
            if (!c) {
                // 구버전 앱 또는 모바일 브라우저 (2-7)
                alert('최신 버전 앱에서 이용할 수 있어요. 앱을 업데이트해 주세요.');
                return null;
            }
            var requestId = 'req-' + Date.now() + '-' + (++seq);
            var msg = { action: action, requestId: requestId, payload: payload || {} };
            pending[requestId] = action;
            if (c === 'ios') {
                window.webkit.messageHandlers.estherpack.postMessage(msg);
            } else {
                window.estherpack.postMessage(JSON.stringify(msg));
            }
            return requestId;
        }

        // 결과 알럿은 앱이 띄운다. 웹은 버튼 잠금만 푼다
        window.estherpackCallback = function (result) {
            var action = pending[result && result.requestId];
            delete pending[result && result.requestId];
            if (action === 'downloadCoupon') {
                couponButton.disabled = false;
            }
        };

        couponButton.onclick = function () {
            // 회신 전까지만 잠시 막는다 (연타 방지)
            if (send('downloadCoupon', { couponCode: COUPON_CODE })) {
                this.disabled = true;
            }
        };

        function toggleHotspot() {
            document.body.classList.toggle('show-hotspot', location.hash === '#hotspot');
        }

        window.addEventListener('hashchange', toggleHotspot);
        toggleHotspot();
    })();
</script>
</body>
</html>
